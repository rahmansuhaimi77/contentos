name: Website Studio brand isolation patch

on:
  push:
    branches: [feat/website-studio-v2]
    paths:
      - .github/workflows/brand-isolation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/website-studio-v2
          fetch-depth: 0
      - name: Patch Website Studio brand isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
                  text = text.replace(old, new, 1)
              p.write_text(text)

          studio_effect = """  useEffect(() => {\n    if (!activeWebsiteId) {\n      setDetail(emptyDetail);\n      return;\n    }\n    void loadSiteDetail(activeWebsiteId);\n  }, [activeWebsiteId]);\n"""
          studio_effect_new = studio_effect + """\n  useEffect(() => {\n    const activeBrand = brands.find((brand) => brand.id === brandId);\n    if (!activeBrand) {\n      setBusinessName('');\n      setSlug('');\n      return;\n    }\n    setBusinessName(activeBrand.name);\n    setSlug(slugify(activeBrand.name));\n  }, [brandId, brands]);\n"""

          patch('app/websites/page.tsx', [
              ("const nextWebsites = (websiteRes.data ?? []) as Website[];", "const allWebsites = (websiteRes.data ?? []) as Website[];"),
              ("    setWebsites(nextWebsites);\n    setBriefs(nextBriefs);", "    const nextWebsites = allWebsites.filter((site) => nextBriefs[site.id]?.brand_id === targetBrandId);\n    setWebsites(nextWebsites);\n    setBriefs(nextBriefs);"),
              ("    const preferred = nextWebsites.find((site) => nextBriefs[site.id]?.brand_id === targetBrandId)?.id || nextWebsites[0]?.id || '';\n    setActiveWebsiteId((current) => nextWebsites.some((site) => site.id === current) ? current : preferred);", "    const preferred = nextWebsites[0]?.id || '';\n    setActiveWebsiteId((current) => nextWebsites.some((site) => site.id === current) ? current : preferred);"),
              (studio_effect, studio_effect_new),
              ("        template_version: 'production_v2',\n        config: { businessName: cleanName, slug: cleanSlug },", "        template_version: 'production_v2',\n        brand_id: brand.id,\n        config: { businessName: cleanName, slug: cleanSlug, brandId: brand.id },"),
              ("<article><span>ALL WEBSITE RECORDS</span><b>{websites.length}</b><small>Legacy + production v2</small></article>", "<article><span>ACTIVE BRAND PROJECTS</span><b>{websites.length}</b><small>Only projects linked to this Brand Brain</small></article>"),
              ("<span className={styles.eyebrow}>NEW PROJECT</span>\n            <label>Business name<input value={businessName} onChange={(event) => { setBusinessName(event.target.value); if (!slug) setSlug(slugify(event.target.value)); }} placeholder=\"e.g. ABC Aircond\" /></label>", "<span className={styles.eyebrow}>NEW PROJECT</span>\n            <div style={{ fontSize: 11, fontWeight: 800, color: '#355246' }}>Creating website for: {selectedBrand?.name || 'Select a Brand Brain'}</div>\n            <label>Business name<input value={businessName} readOnly aria-readonly=\"true\" placeholder=\"Select a Brand Brain first\" /></label>"),
              ("<button disabled={creating || !selectedBrand} onClick={() => void createWebsite()}>{creating ? 'Creating…' : 'Create from Brand Brain'}</button>\n            <small>Creates a private production record only. Nothing is published.</small>", "<button disabled={creating || !selectedBrand} onClick={() => void createWebsite()}>{creating ? 'Creating…' : `Create under ${selectedBrand?.name || 'Brand Brain'}`}</button>\n            <small>Projects are brand-isolated. To build for another business, create or select that business's Brand Brain first. Nothing is published.</small>")
          ])

          common_old = """    setSites(next);\n    const activeBrandId = window.localStorage.getItem('contentos:selectedBrandId');\n    const preferred = next.find((site) => site.brand_id === activeBrandId)?.id || next[0]?.id || '';\n"""
          patch('app/websites/research/page.tsx', [
              (common_old + "    setActiveId((current) => next.some((site) => site.id === current) ? current : preferred);", """    const activeBrandId = window.localStorage.getItem('contentos:selectedBrandId');\n    const visible = next.filter((site) => site.brand_id === activeBrandId);\n    setSites(visible);\n    const preferred = visible[0]?.id || '';\n    setActiveId((current) => visible.some((site) => site.id === current) ? current : preferred);""")
          ])
          patch('app/websites/build/page.tsx', [
              (common_old + "    setActiveId((current) => next.some((site) => site.id === current) ? current : preferred);", """    const activeBrandId = window.localStorage.getItem('contentos:selectedBrandId');\n    const visible = next.filter((site) => site.brand_id === activeBrandId);\n    setSites(visible);\n    const preferred = visible[0]?.id || '';\n    setActiveId((current) => visible.some((site) => site.id === current) ? current : preferred);""")
          ])
          patch('app/websites/qa/page.tsx', [
              (common_old + "    setActiveSiteId((current) => next.some((site) => site.id === current) ? current : preferred);", """    const activeBrandId = window.localStorage.getItem('contentos:selectedBrandId');\n    const visible = next.filter((site) => site.brand_id === activeBrandId);\n    setSites(visible);\n    const preferred = visible[0]?.id || '';\n    setActiveSiteId((current) => visible.some((site) => site.id === current) ? current : preferred);""")
          ])
          patch('app/websites/release/page.tsx', [
              (common_old + "    setActiveSiteId((current) => next.some((site) => site.id === current) ? current : preferred);", """    const activeBrandId = window.localStorage.getItem('contentos:selectedBrandId');\n    const visible = next.filter((site) => site.brand_id === activeBrandId);\n    setSites(visible);\n    const preferred = visible[0]?.id || '';\n    setActiveSiteId((current) => visible.some((site) => site.id === current) ? current : preferred);""")
          ])
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "website-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/websites/page.tsx app/websites/research/page.tsx app/websites/build/page.tsx app/websites/qa/page.tsx app/websites/release/page.tsx
          git commit -m "Enforce active Brand Brain isolation across Website Studio"
          git push origin HEAD:feat/website-studio-v2
